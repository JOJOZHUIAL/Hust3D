# ============================================================
# 3D 打印服务管理系统 · Nginx 配置示例
#
# 假设：
#   - 域名：3d.example.com（请替换成实际域名）
#   - 前端构建产物目录：/var/www/hust3d/dist
#   - 后端 Flask 由 gunicorn 监听 127.0.0.1:5000
#   - 上传目录：/opt/hust3d/backend/uploads
# ============================================================

# 后端反向代理上游
upstream hust3d_backend {
    server 127.0.0.1:5000;
}

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name 3d.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 3d.example.com;

    # SSL 证书（可用 certbot 申请 Let's Encrypt 免费证书）
    ssl_certificate     /etc/nginx/ssl/3d.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/3d.example.com.key;

    # 允许上传 50MB 的 STL 文件（略大于后端限制，留余量）
    client_max_body_size 60m;

    # 前端静态资源（Vue 构建产物）
    root /var/www/hust3d/dist;
    index index.html;

    location / {
        # history 路由回退；若前端用 hash 路由此规则也无害
        try_files $uri $uri/ /index.html;
    }

    # 上传 / 签名文件（后端本地存储目录，路径以 /uploads/ 对外暴露）
    location /uploads/ {
        alias /opt/hust3d/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://hust3d_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传大文件时延长读超时
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    # 静态资源缓存：带版本号（?v=xxx）的静态文件长缓存，
    # 便于前端发版后客户端及时拉取最新资源
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
